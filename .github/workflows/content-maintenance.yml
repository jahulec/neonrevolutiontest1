name: Pages CMS — kontrola i porządkowanie treści

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action context
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: content-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install tooling
        run: npm ci
      - name: Normalize and verify content
        run: npm run content:fix && npm run verify
        env:
          BASE_PATH: /neonrevolutiontest1
      - name: Commit normalized data
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "content: normalize CMS data"
          git push
